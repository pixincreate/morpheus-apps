name: Build

# Build patched, signed APKs from the newest public Morphe patch bundle and
# publish one versioned private release per app: ather-<version> and
# nothingx-<version>. Each release carries a single merged APK, named
# morpheus-<app>-<version>.apk, so Obtainium can detect and install updates.
#
# This repository is private and must stay private. It holds the signing key in
# an encrypted secret and the untouched vendor APKs as private release assets.
# Publishing the outputs would redistribute patched copies of the vendor apps,
# so keep the repository and every release private.
#
# Required secrets (see README.md for the gh secret set commands):
#   KEYSTORE_BASE64     base64 of the signing keystore
#   KEYSTORE_PASSWORD   keystore password
#   KEY_PASSWORD        key password
#   KEY_ALIAS           key alias
#
# GITHUB_TOKEN is automatic. It reads this repository's private vendor releases
# and the public patch bundle release, and writes the app releases.

on:
  workflow_dispatch:
  schedule:
    # Weekly. The vendor versions change rarely, and every run downloads the
    # vendor APKs, the patch bundle, and two pinned tools.
    - cron: "0 2 * * 1"

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.app.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # One build per app at a time; a manual dispatch waits for the scheduled run.
    concurrency:
      group: build-${{ matrix.app.name }}
      cancel-in-progress: false

    strategy:
      # One app failing must not lose the other app's build.
      fail-fast: false
      matrix:
        app:
          - name: ather
            title: Ather
            package: com.athermobileapp
            version: "13.5.0"
            version_code: "321"
            # Explicit: the maintainer's untouched APKs are named config.*.apk.
            splits: config.arm64_v8a config.en config.mdpi
          - name: nothingx
            title: Nothing X
            package: com.nothing.smartcenter
            version: "3.8.0"
            version_code: "3080004"
            # Nothing X ships a base APK plus many config splits under names the
            # vendor bundle decides. scripts/build.sh discovers every *.apk in
            # vendor/nothingx/ that is not the base APK.
            splits: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes with git, so do not leave the write-scoped token in
          # .git/config, where the patch and merge tools could read it.
          persist-credentials: false

      - name: Set up JDK
        # The Morphe CLI, APKEditor and apksigner run on this JDK; JAVA_HOME
        # points at it.
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "build-tools;37.0.0"

      - name: Fetch vendor APKs
        # The private vendor release is the primary source. Only when it is
        # missing does the step fall back to scripts/fetch-vendor-apks.mjs,
        # which drives a headed browser through patchright: APKPure serves the
        # direct endpoints behind Cloudflare, and headless Chromium loops
        # through the challenge without ever firing the download. Headed mode
        # needs a display, so run it under Xvfb. This path is best-effort;
        # APKPure can change the endpoint or the challenge at any time. The
        # verify step gates whatever arrives.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          app="${{ matrix.app.name }}"
          tag="vendor/$app/${{ matrix.app.version }}"
          mkdir -p "vendor/$app"
          if gh release download "$tag" -p '*.apk' -D "vendor/$app" --clobber; then
            echo "Fetched the vendor APKs from the private release $tag"
          else
            echo "::warning::The private release $tag has no APK assets. Falling back to scripts/fetch-vendor-apks.mjs."
            if ! command -v xvfb-run >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y xvfb
            fi
            npm install --no-save --no-audit --no-fund patchright@1.63.0
            npx --yes patchright install chromium
            xvfb-run -a node scripts/fetch-vendor-apks.mjs \
              "$app" "${{ matrix.app.version }}" "${{ matrix.app.version_code }}"
          fi

      - name: Verify vendor APKs
        shell: bash
        env:
          APP: ${{ matrix.app.name }}
          APP_PACKAGE: ${{ matrix.app.package }}
        run: bash scripts/verify-vendor-apks.sh

      - name: Download the newest patch bundle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p bundle
          gh release download --repo pixincreate/morpheus --pattern 'patches-*.mpp' -D bundle --clobber
          ls -l bundle

      - name: Build and merge
        # No signing secret is in scope here. The patch bundle and APKEditor are
        # third-party code, so do not run them next to the keystore or its
        # passwords.
        shell: bash
        env:
          APP_NAME: ${{ matrix.app.name }}
          APP_PACKAGE: ${{ matrix.app.package }}
          SPLITS: ${{ matrix.app.splits }}
        run: bash scripts/build.sh

      - name: Decode the signing keystore
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }} # keywatch:ignore
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }} # keywatch:ignore
        run: |
          set -euo pipefail
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Set them with the gh secret set commands in README.md."
            exit 1
          fi
          ks="$(mktemp)"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ks"
          chmod 600 "$ks"
          echo "path=$ks" >> "$GITHUB_OUTPUT"

      - name: Sign the merged APK
        shell: bash
        env:
          APKS: build/merged-unsigned.apk
          SIGNED_NAME: ${{ matrix.app.name }}
          KS: ${{ steps.keystore.outputs.path }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: bash scripts/sign-all.sh

      - name: Stage the signed APK
        # The merge must leave exactly one APK: a release carries one file so
        # Obtainium installs it with a plain install.
        shell: bash
        run: |
          set -euo pipefail
          count="$(find out/signed -maxdepth 1 -name '*.apk' | wc -l | tr -d ' ')"
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one signed APK, found $count. The split merge failed."
            ls -l out/signed
            exit 1
          fi
          mkdir -p dist
          cp out/signed/*.apk "dist/morpheus-${{ matrix.app.name }}-${{ matrix.app.version }}.apk"
          ls -l dist

      - name: Upload the signed APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-${{ matrix.app.name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish the release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ matrix.app.name }}-${{ matrix.app.version }}
          name: ${{ matrix.app.title }} ${{ matrix.app.version }}
          body: |
            Patched and signed Morphe build of ${{ matrix.app.title }} ${{ matrix.app.version }}.

            Install on the phone:

                adb install morpheus-${{ matrix.app.name }}-${{ matrix.app.version }}.apk

            Obtainium: add this repository as a source, filter the release titles
            with `^${{ matrix.app.title }}`, and extract the version with
            `(\d+\.\d+\.\d+)`. See README.md for the exact settings.

            Every build is signed with the same key, so an install replaces the
            previous build. This release is private: do not publish the APK.
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: false
          artifacts: "dist/*.apk"
          artifactErrorsFailBuild: true

      - name: Delete the signing keystore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ks="${{ steps.keystore.outputs.path }}"
          if [ -n "$ks" ] && [ -f "$ks" ]; then
            rm -f "$ks"
          fi
